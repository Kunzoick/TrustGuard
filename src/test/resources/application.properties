# Test-only EVENT_HMAC_KEY (Ruling 88): Base64.getEncoder().encodeToString(new byte[32]), i.e. 32 zero bytes.
# @DynamicPropertySource values still override it.
trustguard.events.hmac-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
# Redis timeouts for tests (Ruling D4): the production default of 50 ms would flake on a slow CI machine.
# SignalsIntegrationTestBase overrides both with 500ms for its unreachable-Redis contexts.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s